version: 0.2
phases:
  install:
    runtine-versions:
      nodejs: 20
  build:
    commands:
      - echo "Iniciando build do react..."
      - cd client
      -npm install
      - REACT_APP_API_URL=https://bia-serverless.lfaleiros-engdados.com.br SKIP_PREFLIGHT_CHECK=true npm run build
artifacts:
  files:
    - '**/*'
  base-directory: client/build